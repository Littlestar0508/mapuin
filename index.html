<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>네이버 지도 · 차량 이동거리</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>차량 이동거리 확인</h1>
        <p>출발지와 도착지를 지도 핀 또는 장소 목록에서 선택하세요.</p>
      </div>
      <a id="naver-list-link" href="#" target="_blank" rel="noopener noreferrer" hidden>네이버 저장 리스트 열기 ↗</a>
    </header>

    <section class="result" aria-label="선택된 장소와 차량 경로">
      <div class="selected">
        <span>출발지 <strong id="start-name">미선택</strong></span>
        <span>도착지 <strong id="goal-name">미선택</strong></span>
      </div>
      <div class="result-row">
        <strong id="distance">거리: -</strong>
        <span id="duration">예상 시간: -</span>
        <button id="reset" type="button">다시 선택</button>
      </div>
      <p id="status" role="status" aria-live="polite">지도를 준비하고 있습니다...</p>
    </section>

    <div class="layout">
      <section class="map-panel" aria-label="지도 영역">
        <div id="map" aria-label="네이버 지도"></div>
      </section>
      <aside class="list-panel" aria-label="장소 목록">
        <h2>저장 리스트 장소</h2>
        <div id="place-list" class="place-list"></div>
        <small>자동 조회가 실패하면 <code>places.json</code>의 로컬 복사본을 사용합니다.</small>
      </aside>
    </div>
  </main>
</body>
</html>
